[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostinspector-mcp-server"
version = "0.2.0"
description = "MCP server for Ghost Inspector - automated browser testing platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "ghost-inspector", "testing", "automation", "browser-testing"]
authors = [
    { name = "Tempest" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
    "ruff>=0.1",
]

[project.scripts]
ghostinspector-mcp = "ghostinspector_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostinspector_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
